services:
  # Web Service
  - type: web
    name: liquidai
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: liquidai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: liquidai_app
      - key: OWNER_OPEN_ID
        sync: false

databases:
  - name: liquidai-db
    databaseName: liquidai
    user: liquidai
